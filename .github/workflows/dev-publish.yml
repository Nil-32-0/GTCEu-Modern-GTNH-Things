name: Dev Publish

on:
    push:
        branches:
            - dev

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
                fetch-tags: true
            
            - name: Setup JDK 12
              uses: actions/setup-java@v4
              with:
                java-version: '21'
                distribution: 'temurin'
            
            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Build with Gradle
              run: ./gradlew build

            - name: Get date
              run: echo "datetime=$(date +'%Y-%m-%d-%H-%M-%S')" >> $GITHUB_ENV

            - name: Release
              uses: softprops/action-gh-release@v3
              with:
                tag_name: dev-${{env.datetime}}
                prerelease: true
                working_directory: build/libs
                files: |
                    gtnhthings-*.jar